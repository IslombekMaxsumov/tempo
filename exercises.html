<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEMPO</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#dfe6e9">
  <link rel="icon" href="assets/brand/tempo-favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <!-- Apply the saved theme before the page is drawn, so it never flashes. -->
  <script>
    window.APP_NS = "fitness";
    try {
      var savedTheme = localStorage.getItem("fitness:theme");
      document.documentElement.setAttribute("data-theme", savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/site.css">
  <script defer src="js/core.js"></script>
  <script defer src="js/lang.js"></script>
  <script defer src="js/data-exercises.js"></script>
  <script defer src="js/fit.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/pages/exercises.js"></script>
</head>
<body data-page="exercises">
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main" tabindex="-1" class="container page">
    <h1 data-i18n="page.exercises"></h1>
    <form id="exFilters" class="filters" role="search" novalidate>
      <div class="field">
        <label for="q" data-i18n="filters.search"></label>
        <input id="q" type="search" class="input" autocomplete="off" data-i18n-placeholder="filters.exercisePh">
      </div>
      <fieldset>
        <legend data-i18n="filters.muscle"></legend>
        <div id="groupChips" class="chips"></div>
      </fieldset>
      <div class="field">
        <label for="equipment" data-i18n="filters.equipment"></label>
        <select id="equipment" class="select"></select>
      </div>
    </form>
    <p id="resultCount" class="result-count" role="status"></p>
    <ul id="grid" class="ex-grid"></ul>
    <div id="empty" class="empty" hidden>
      <h2 data-i18n="ex.emptyTitle"></h2>
      <p data-i18n="ex.emptyText"></p>
      <button type="button" id="emptyClear" class="btn" data-i18n="filters.clear"></button>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <div id="toasts" class="toast-host"></div>
</body>
</html>
